<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Currency Converter</title>
    <link rel="stylesheet" href="style.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
      integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
  </head>
  <body>
    <div class="container">
      <h1><i>Currency Converter</i></h1>
      <form class="form">
        <div class="amount">
          <label for="amount">Enter Amount</label>
          <input id="amount" type="text" required />
        </div>
        <div class="dropdown">
          <div class="from">
            <label for="from">From</label>
            <img src="https://flagsapi.com/US/flat/64.png" alt="United States Flag" />
            <select id="from" name="from" aria-label="Select From Currency"></select>
          </div>
          <i class="fa-solid fa-arrows-rotate"></i>
          <div class="to">
            <label for="to">To</label>
            <img src="https://flagsapi.com/PK/flat/64.png" alt="Pakistan Flag" />
            <select id="to" name="to" aria-label="Select To Currency"></select>
          </div>
        </div>
        <div class="msg">1 USD = 277 PKR</div>
        <button type="button">Get Exchange Rate</button>
      </form>
    </div>
    <script src="codes.js"></script>
    <script src="app.js"></script>
  </body>
</html>
